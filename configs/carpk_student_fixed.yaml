# B1：CARPK固定sigma标签上的1/4-CSRNet学生基线，不使用教师或知识蒸馏。
# 数据划分、监督标签和评估口径与B0保持一致。

experiment:
#  name: carpk_b1_quarter_student_fixed_sigma8
#  output_dir: outputs/carpk/b1_student_fixed_sigma8
  name: carpk_b1_quarter_student_fixed_sigma8_fp32
  output_dir: outputs/carpk/b1_student_fixed_sigma8_fp32
  seed: 42
  device: cuda:0
  deterministic: false

data:
  data_root: data/raw/CARPK/CARPK_devkit/data
  target_root: data/processed/CARPK/fixed_sigma
  train_manifest: data/manifests/CARPK/train.json
  val_manifest: data/manifests/CARPK/val.json
  test_manifest: data/manifests/CARPK/test.json
  train_full_manifest: data/manifests/CARPK/train_full.json
  output_stride: 8
  batch_size: 1
  validation_batch_size: 1
  workers: 4
  horizontal_flip_probability: 0.5

model:
  # 除最终单通道输出外，各卷积层通道均为完整CSRNet的四分之一。
  channel_ratio: 4

training:
#  epochs: 200
#  # 原SKT公开脚本使用Adam和1e-4训练学生；B2也应沿用本设置做公平比较。
#  learning_rate: 0.0001
#  weight_decay: 0.0005
#  loss_reduction: batch_mean_sum
#  amp: true
#  print_frequency: 20
#  gradient_clip_norm: null
#  lr_factor: 0.5
#  lr_patience: 10
#  minimum_learning_rate: 0.0000001
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.0005
  loss_reduction: batch_mean_sum
  amp: false
  print_frequency: 20
  gradient_clip_norm: null
  lr_factor: 0.5
  lr_patience: 1000
  minimum_learning_rate: 0.0000001

evaluation:
  save_visualizations: 20
  save_worst_visualizations: 20
