# B2-C：在原始B2 SKT蒸馏上增加图像级相对计数约束。
#
# 这是计数约束的单变量消融：除count_loss_weight外，其余数据、模型、教师、
# 初始化、优化器和训练轮数全部与B2一致。请先运行本实验，再决定是否与B3结合。

experiment:
  name: carpk_b2c_quarter_student_skt_count_fixed_sigma8_fp32
  output_dir: outputs/carpk/b2c_student_skt_count_fixed_sigma8_fp32
  seed: 42
  device: cuda:0
  deterministic: false

data:
  data_root: data/raw/CARPK/CARPK_devkit/data
  target_root: data/processed/CARPK/fixed_sigma
  train_manifest: data/manifests/CARPK/train.json
  val_manifest: data/manifests/CARPK/val.json
  test_manifest: data/manifests/CARPK/test.json
  train_full_manifest: data/manifests/CARPK/train_full.json
  output_stride: 8
  batch_size: 1
  validation_batch_size: 1
  workers: 4
  horizontal_flip_probability: 0.5

model:
  channel_ratio: 4

teacher:
  # 使用验证MAE选出的第53轮FP32固定学习率教师，训练期间始终冻结。
  checkpoint: outputs/carpk/b0_teacher_fixed_sigma8_fp32_fixed_lr/best_mae.pth

distillation:
  # 对应原SKT：loss_h + loss_s + 0.5 * loss_fsp + 0.5 * loss_cos。
  gt_density_weight: 1.0
  output_distillation_weight: 1.0
  fsp_weight: 0.5
  cosine_weight: 0.5
  # 显式约束学生密度图积分，初始实验固定为1.0，只能根据验证集做后续消融。
  count_loss_weight: 1.0
  # 前三层分别池化8、4、2倍；六个中间特征与密度输出共同计算Dense-FSP。
  fsp_scales: [3, 2, 1]

count_loss:
  # r=(预测计数-真实计数)/(真实计数+offset)。offset也保护空场景。
  offset: 1.0
  # 相对误差10%以内为二次区间，超过后近似线性，减弱异常图像影响。
  beta: 0.1

training:
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.0005
  loss_reduction: batch_mean_sum
  amp: false
  print_frequency: 20
  gradient_clip_norm: null
  # 与B1相同：patience大于总epoch，训练期间基础学习率保持1e-4。
  lr_factor: 0.5
  lr_patience: 1000
  minimum_learning_rate: 0.0000001

evaluation:
  save_visualizations: 20
  save_worst_visualizations: 20
